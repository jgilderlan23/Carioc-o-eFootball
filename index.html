<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brasileirão eFootball</title>
</head>
<body onload="inicializar()">

    <div class="container">
        <h1>🏆 BRASILEIRÃO EFOOTBALL</h1>
        <p>LIGA OFICIAL X1 - bringmetheorizo, EoLuckyzinJr, Vitor90show, VitinhoRJ, Bened, FPETOP, W7masterzz</p>

        <div id="jogos"></div>

        <table id="tabela" border="1" style="width:100%; border-collapse: collapse; margin-top: 20px; text-align: center;">
            <thead>
                <tr style="background-color: #f2f2f2;">
                    <th>Pos</th>
                    <th>Jogador</th>
                    <th>Pts</th>
                    <th>PJ</th>
                    <th>V</th>
                    <th>E</th>
                    <th>D</th>
                    <th>GP</th>
                    <th>GC</th>
                    <th>SG</th>
                </tr>
            </thead>
            <tbody id="corpo-tabela">
                <!-- Preenchido via JavaScript -->
            </tbody>
        </table>
    </div>

    <script>
        const jogadores = ["bringmetheorizo", "EoLuckyzinJr", "Vitor90show", "VitinhoRJ", "Bened", "FPETOP", "W7masterzz"];
        let confrontos = [];

        function gerarConfrontos() {
            confrontos = [];
            for (let i = 0; i < jogadores.length; i++) {
                for (let j = i + 1; j < jogadores.length; j++) {
                    confrontos.push([jogadores[i], jogadores[j]]);
                    confrontos.push([jogadores[j], jogadores[i]]);
                }
            }
        }

        function inicializar() {
            gerarConfrontos();
            const divJogos = document.getElementById('jogos');
            divJogos.innerHTML = ""; 

            confrontos.forEach((par, i) => {
                if (i % 2 === 0 && i !== 0) {
                    divJogos.innerHTML += '<hr style="border: 0; border-top: 1px dashed #333; margin: 15px 0;">';
                }
                divJogos.innerHTML += `
                    <div style="margin-bottom: 8px;">
                        <span>${par[0]}</span>
                        <input type="number" id="s1-${i}" oninput="atualizarTabela()" style="width: 35px; text-align: center;" min="0"> x 
                        <input type="number" id="s2-${i}" oninput="atualizarTabela()" style="width: 35px; text-align: center;" min="0">
                        <span>${par[1]}</span>
                    </div>
                `;
            });
            atualizarTabela();
        }

        function atualizarTabela() {
            let stats = {};
            jogadores.forEach(j => stats[j] = { pts: 0, pj: 0, v: 0, e: 0, d: 0, gp: 0, gc: 0 });

            confrontos.forEach((par, i) => {
                let el1 = document.getElementById(`s1-${i}`);
                let el2 = document.getElementById(`s2-${i}`);
                
                if (el1 && el2 && el1.value.trim() !== "" && el2.value.trim() !== "") {
                    let s1 = parseInt(el1.value);
                    let s2 = parseInt(el2.value);
                    let timeA = par[0];
                    let timeB = par[1];

                    stats[timeA].pj++;
                    stats[timeB].pj++;

                    stats[timeA].gp += s1;
                    stats[timeA].gc += s2;
                    stats[timeB].gp += s2;
                    stats[timeB].gc += s1;

                    if (s1 > s2) { 
                        stats[timeA].pts += 3; 
                        stats[timeA].v++; 
                        stats[timeB].d++; 
                    } else if (s2 > s1) { 
                        stats[timeB].pts += 3; 
                        stats[timeB].v++; 
                        stats[timeA].d++; 
                    } else { 
                        stats[timeA].pts += 1; 
                        stats[timeA].e++;
                        stats[timeB].pts += 1; 
                        stats[timeB].e++;
                    }
                }
            });

            let ranking = Object.keys(stats).map(name => ({ 
                name, ...stats[name], sg: stats[name].gp - stats[name].gc 
            }));

            ranking.sort((a, b) => b.pts - a.pts || b.v - a.v || b.sg - a.sg || b.gp - a.gp);

            const corpo = document.getElementById('corpo-tabela');
            corpo.innerHTML = "";

            ranking.forEach((item, index) => {
                corpo.innerHTML += `
                    <tr>
                        <td>${index + 1}º</td>
                        <td><b>${item.name}</b></td>
                        <td>${item.pts}</td>
                        <td>${item.pj}</td>
                        <td>${item.v}</td>
                        <td>${item.e}</td>
                        <td>${item.d}</td>
                        <td>${item.gp}</td>
                        <td>${item.gc}</td>
                        <td>${item.sg}</td>
                    </tr>
                `;
            });
        }
    </script>
</body>
</html>
