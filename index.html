
<div class="container">
        <h1>🏆 BRASILEIRÃO EFOOTBALL</h1>
        <p>LIGA OFICIAL X1 - bringmetheorizo, EoLuckyzinJr, Vitor90show, VitinhoRJ, Bened, FPETOP, W7masterzz</p>

        <table id="tabela">
            <thead>
    </div>

    <script>
        // Lista atualizada com os novos integrantes e a alteração do nome
        const jogadores = ["bringmetheorizo", "EoLuckyzinJr", "Vitor90show", "VitinhoRJ", "Bened", "FPETOP", "W7masterzz"];

        let confrontos = [];

        // Função para gerar confrontos de ida e volta seguidos automaticamente para qualquer número de jogadores
        function gerarConfrontos() {
            confrontos = [];
            for (let i = 0; i < jogadores.length; i++) {
                for (let j = i + 1; j < jogadores.length; j++) {
                    // Adiciona Jogo de Ida e Jogo de Volta logo em seguida
                    confrontos.push([jogadores[i], jogadores[j]]);
                    confrontos.push([jogadores[j], jogadores[i]]);
                }
            }
        }

        function inicializar() {
            gerarConfrontos();
            const divJogos = document.getElementById('jogos');
            divJogos.innerHTML = ""; 

            confrontos.forEach((par, i) => {
                // Linha divisória a cada par de jogos (Ida e Volta)
                if (i % 2 === 0 && i !== 0) {
                    divJogos.innerHTML += '<hr style="border: 0; border-top: 1px dashed #333; margin: 15px 0;">';
                }
                // (O restante da criação dos inputs de jogos continua igual na sua estrutura...)
            });
        }

        function atualizarTabela() {
            let stats = {};
            // Reinicia os stats para garantir contagem limpa
            jogadores.forEach(j => stats[j] = { pts: 0, pj: 0, v: 0, e: 0, d: 0, gp: 0, gc: 0 });

            confrontos.forEach((par, i) => {
                let v1 = document.getElementById(`s1-${i}`).value;
                let v2 = document.getElementById(`s2-${i}`).value;

                // Correção para aceitar 0x0: verifica se o campo não está vazio
                if (v1.trim() !== "" && v2.trim() !== "") {
                    let s1 = parseInt(v1);
                    let s2 = parseInt(v2);
                    let timeA = par[0];
                    let timeB = par[1];

                    stats[timeA].pj++;
                    stats[timeB].pj++;

                    stats[timeA].gp += s1;
                    stats[timeA].gc += s2;
                    stats[timeB].gp += s2;
                    stats[timeB].gc += s1;

                    if (s1 > s2) { 
                        stats[timeA].pts += 3; 
                        stats[timeA].v++; 
                        stats[timeB].d++; 
                    } else if (s2 > s1) { 
                        stats[timeB].pts += 3; 
                        stats[timeB].v++; 
                        stats[timeA].d++; 
                    } else { 
                        stats[timeA].pts += 1; 
                        stats[timeA].e++;
                        stats[timeB].pts += 1; 
                        stats[timeB].e++;
                    }
                }
            });

            let ranking = Object.keys(stats).map(name => ({ 
                name, ...stats[name], sg: stats[name].gp - stats[name].gc 
            }));

            // Critérios: Pontos > Vitórias > Saldo de Gols > Gols Pró
            ranking.sort((a, b) => b.pts - a.pts || b.v - a.v || b.sg - a.sg || b.gp - a.gp);

            const corpo = document.getElementById('corpo-tabela');
            // (Atualização do HTML da tabela...)
        }
    </script>
