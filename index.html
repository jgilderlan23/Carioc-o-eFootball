<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brasileirão eFootball - Oficial</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #05070a; color: white; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h1 { color: #00ff88; text-shadow: 0 0 10px rgba(0, 255, 136, 0.3); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 2px; }
        p { color: #888; margin-bottom: 20px; font-weight: bold; }
        .container { width: 100%; max-width: 800px; }
        table { width: 100%; border-collapse: collapse; background: #111418; margin-bottom: 30px; border-radius: 10px; overflow: hidden; border: 1px solid #333; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #222; }
        th { background: #00ff88; color: #000; text-transform: uppercase; font-size: 0.85em; }
        .match-card { background: #111418; padding: 15px; margin: 8px 0; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; }
        .input-score { width: 55px; padding: 10px; text-align: center; border-radius: 5px; border: 1px solid #444; background: #000; color: #00ff88; font-weight: bold; font-size: 1.2em; }
        .team-name { width: 35%; font-weight: bold; font-size: 0.95em; color: #eee; }
        button { background: #00ff88; color: #000; border: none; padding: 18px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 1.1em; margin: 20px 0; transition: 0.3s; width: 100%; box-shadow: 0 4px 15px rgba(0, 255, 136, 0.2); }
        button:hover { background: #00cc6e; transform: translateY(-2px); }
        .rodada-label { color: #00ff88; font-size: 0.8em; margin-top: 25px; display: block; border-left: 3px solid #00ff88; padding-left: 10px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🏆 BRASILEIRÃO EFOOTBALL</h1>
        <p>LIGA OFICIAL X1 - SCARLLXD, EoLuckyzinJr, Vitor90show, VitinhoRJ</p>

        <table id="tabela">
            <thead>
                <tr>
                    <th>Pos</th>
                    <th>Jogador</th>
                    <th>Pts</th>
                    <th>PJ</th>
                    <th>V</th>
                    <th>E</th>
                    <th>D</th>
                    <th>GP</th>
                    <th>SG</th>
                </tr>
            </thead>
            <tbody id="corpo-tabela"></tbody>
        </table>

        <button onclick="atualizarTabela()">💾 ATUALIZAR CLASSIFICAÇÃO</button>

        <span class="rodada-label">CONFRONTOS DE IDA E VOLTA</span>
        <div id="jogos"></div>
    </div>

    <script>
        const jogadores = ["SCARLLXD", "EoLuckyzinJr", "Vitor90show", "VitinhoRJ"];
        
        const confrontos = [
            ["SCARLLXD", "EoLuckyzinJr"], ["Vitor90show", "VitinhoRJ"],
            ["SCARLLXD", "Vitor90show"], ["EoLuckyzinJr", "VitinhoRJ"],
            ["SCARLLXD", "VitinhoRJ"], ["EoLuckyzinJr", "Vitor90show"],
            ["EoLuckyzinJr", "SCARLLXD"], ["VitinhoRJ", "Vitor90show"],
            ["Vitor90show", "SCARLLXD"], ["VitinhoRJ", "EoLuckyzinJr"],
            ["VitinhoRJ", "SCARLLXD"], ["Vitor90show", "EoLuckyzinJr"]
        ];

        function inicializar() {
            const divJogos = document.getElementById('jogos');
            confrontos.forEach((par, i) => {
                divJogos.innerHTML += `
                    <div class="match-card">
                        <span class="team-name" style="text-align: right;">${par[0]}</span>
                        <input type="number" class="input-score" id="s1-${i}" placeholder="0">
                        <span style="color: #555">X</span>
                        <input type="number" class="input-score" id="s2-${i}" placeholder="0">
                        <span class="team-name" style="text-align: left;">${par[1]}</span>
                    </div>
                `;
            });
            atualizarTabela();
        }

        function atualizarTabela() {
            let stats = {};
            jogadores.forEach(j => stats[j] = { pts: 0, pj: 0, v: 0, e: 0, d: 0, gp: 0, gc: 0 });

            confrontos.forEach((par, i) => {
                let v1 = document.getElementById(`s1-${i}`).value;
                let v2 = document.getElementById(`s2-${i}`).value;

                if (v1 !== "" && v2 !== "") {
                    let s1 = parseInt(v1);
                    let s2 = parseInt(v2);

                    stats[par[0]].pj++; stats[par[1]].pj++;
                    stats[par[0]].gp += s1; stats[par[1]].gp += s2;
                    stats[par[0]].gc += s2; stats[par[1]].gc += s1;

                    if (s1 > s2) { 
                        stats[par[0]].pts += 3; stats[par[0]].v++; stats[par[1]].d++;
                    } else if (s2 > s1) { 
                        stats[par[1]].pts += 3; stats[par[1]].v++; stats[par[0]].d++;
                    } else { 
                        stats[par[0]].pts += 1; stats[par[1]].pts += 1; 
                        stats[par[0]].e++; stats[par[1]].e++;
                    }
                }
            });

            let ranking = jogadores.map(name => ({ 
                name, ...stats[name], sg: stats[name].gp - stats[name].gc 
            }));

            ranking.sort((a, b) => b.pts - a.pts || b.v - a.v || b.sg - a.sg || b.gp - a.gp);

            const corpo = document.getElementById('corpo-tabela');
            corpo.innerHTML = "";
            ranking.forEach((j, i) => {
                corpo.innerHTML += `
                    <tr>
                        <td>${i + 1}º</td>
                        <td style="text-align: left; font-weight: bold; color: #00ff88;">${j.name}</td>
                        <td>${j.pts}</td>
                        <td>${j.pj}</td>
                        <td>${j.v}</td>
                        <td>${j.e}</td>
                        <td>${j.d}</td>
                        <td>${j.gp}</td>
                        <td>${j.sg}</td>
                    </tr>
                `;
            });
        }

        inicializar();
    </script>
</body>
</html>
